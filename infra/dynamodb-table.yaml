AWSTemplateFormatVersion: "2010-09-09"
Description: Ellie single-table household memory store
Parameters:
  TableName:
    Type: String
    Default: ellie-main
Resources:
  EllieMemoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: project
          Value: ellie
Outputs:
  TableName:
    Value: !Ref EllieMemoryTable
  TableArn:
    Value: !GetAtt EllieMemoryTable.Arn

services:
  ellie:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    profiles: [local-db]
    ports:
      - "8000:8000"
